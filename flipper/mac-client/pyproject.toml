[project]
name = "flipper-state"
version = "0.1.0"
description = "Send AI state updates to Flipper Zero over Bluetooth LE"
requires-python = ">=3.11"
dependencies = ["bleak>=1.0,<2"]

[project.scripts]
flipper-state = "flipper_state:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flipper_state"]

