<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flipper Pet 控制台</title><style>
:root{color-scheme:light;--bg:#f3f5f8;--panel:#fff;--line:#dce2ea;--text:#252c38;--muted:#667085;--accent:#d96d35;--green:#168a48;--yellow:#c98013;--red:#d13d3d;--blue:#3478cf;--purple:#8b5cc7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}header{height:58px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0}header b{font-size:17px}header span{color:var(--muted)}main{max-width:1180px;margin:0 auto;padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:16px}.wide{grid-column:1/-1}section{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px}h2{font-size:14px;margin:0 0 14px}button{border:1px solid #c8d0db;background:#fff;border-radius:6px;padding:7px 11px;cursor:pointer;color:var(--text)}button:hover{border-color:var(--accent)}button:disabled{opacity:.45}.primary{background:var(--accent);border-color:var(--accent);color:white}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid #edf0f4}.row:first-of-type{border-top:0}.sub{color:var(--muted);font-size:12px}.badge{font-size:12px;padding:2px 8px;border-radius:999px;background:#f1f3f6;color:var(--muted)}.badge.on{background:#eaf7ef;color:var(--green)}.states{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.state{height:46px;font-weight:600}.state[data-s=idle]{border-left:4px solid #89919e}.state[data-s=thinking]{border-left:4px solid var(--blue)}.state[data-s=running]{border-left:4px solid var(--yellow)}.state[data-s=approval]{border-left:4px solid var(--purple)}.state[data-s=success]{border-left:4px solid var(--green)}.state[data-s=error]{border-left:4px solid var(--red)}#events{height:220px;overflow:auto;background:#14181f;color:#d9e0ea;padding:12px;border-radius:6px;font:12px/1.7 ui-monospace,monospace}.evt{border-bottom:1px solid #29303b;padding:3px 0}.time{color:#7f8a9c}.platforms{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.platform{border:1px solid var(--line);padding:12px;border-radius:6px}.platform b{display:block;margin-bottom:4px}.effects{display:grid;gap:8px}.effect{display:grid;grid-template-columns:80px 48px minmax(130px,1fr) 130px 90px 120px;align-items:center;gap:10px;padding:9px 0;border-top:1px solid #edf0f4}.effect:first-child{border-top:0}.effect input[type=color]{width:42px;height:34px;padding:2px;border:1px solid var(--line);border-radius:5px;background:#fff}.effect input[type=range]{width:100%}.effect input[type=number],.effect select{width:100%;height:34px;border:1px solid #c8d0db;border-radius:5px;background:#fff;padding:0 7px}.range{display:flex;align-items:center;gap:6px}.range output{width:38px;text-align:right;color:var(--muted)}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}.approval-setting{display:flex;align-items:center;gap:8px}.approval-setting select{height:34px;min-width:180px;border:1px solid #c8d0db;border-radius:5px;background:#fff;padding:0 7px}@media(max-width:760px){main{grid-template-columns:1fr}.wide{grid-column:auto}.states,.platforms{grid-template-columns:1fr 1fr}.effect{grid-template-columns:64px 44px 1fr}.effect input,.effect select{min-width:0}.approval-setting{align-items:stretch;flex-direction:column}.approval-setting select{width:100%}}
.approval-timeout{display:flex;align-items:center;gap:5px;white-space:nowrap}.approval-timeout input{width:72px;height:34px;border:1px solid #c8d0db;border-radius:5px;padding:0 7px}.approval-timeout.disabled{opacity:.45}@media(max-width:760px){.approval-timeout input{width:100%}}
</style></head><body><header><b>Flipper Pet 控制台</b><span id="service">正在连接服务...</span></header><main>
<section><h2>设备</h2><div id="device"></div><div id="usb"></div><h2 style="margin-top:18px">状态测试</h2><div class="states" id="states"></div></section>
<section><h2>AI 接入</h2><div style="margin-bottom:8px"><button class="primary" onclick="installAll()">安装全部已检测工具</button> <button onclick="refresh()">重新检测</button></div><div id="agents"></div><div class=row><div><b>是否需要 AI Pet 接管</b><div class=sub>无需接管仍会在设备上提示待确认，但只能在电脑操作</div></div><div class=approval-setting><select id=approval-mode onchange=updateApprovalModeUi()><option value=full>完全接管</option><option value=none>无需接管</option><option value=handoff>响应转移接管</option></select><label id=approval-timeout-wrap class=approval-timeout><input id=approval-timeout type=number min=1 max=300 value=5> 秒</label><button class=primary onclick=saveApprovalMode()>保存</button></div></div></section>
<section class="wide"><h2>状态提醒</h2><div class="effects" id="effects"></div><div class="actions"><button onclick="loadEffects()">撤销修改</button><button class="primary" onclick="saveEffects()">保存设置</button></div></section>
<section class="wide"><h2>实时事件</h2><div id="events"></div></section>
<section class="wide"><h2>操作系统方案</h2><div class="platforms" id="platforms"></div></section>
</main><script>
const $=s=>document.querySelector(s), names={idle:'待机',thinking:'思考',running:'执行',approval:'待确认',success:'成功',error:'异常'};
const modeNames={off:'关闭',solid:'常亮',blink:'闪烁',breathe:'呼吸',timeout:'自动关闭'},soundNames={none:'静音',single:'单声',double:'双声',triple:'三声',success:'成功音',error:'错误音'};
async function api(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.error||r.statusText);return d}
async function setState(state){try{await api('/api/devices/flipper-zero/state',{state});addEvent({time:new Date().toLocaleTimeString(),agent:'manual',event:'state',state})}catch(e){alert(e.message)}await refresh()}
async function installAgent(id){try{await api('/api/agents/'+id+'/install',{})}catch(e){alert(e.message)}await refresh()}
async function installUsb(){const button=$('#usb-install');if(button)button.disabled=true;try{const r=await api('/api/usb/install',{});alert('AI Pet 已安装到 '+r.port)}catch(e){alert(e.message)}await refresh()}
async function bindUsb(){try{const r=await api('/api/usb/bind',{});alert('电脑已绑定。现在请启动或重启 AI Pet，首次 BLE 连接会显示系统 PIN。')}catch(e){alert(e.message)}await refresh()}
async function installAll(){const d=await api('/api/agents');for(const a of d.agents)if(a.available)await installAgent(a.id)}
function updateApprovalModeUi(){const enabled=$('#approval-mode').value==='handoff';$('#approval-timeout').disabled=!enabled;$('#approval-timeout-wrap').classList.toggle('disabled',!enabled)}
async function loadApprovalSettings(){const d=await api('/api/settings');$('#approval-mode').value=d.settings.approval_mode;$('#approval-timeout').value=d.settings.approval_timeout_seconds;updateApprovalModeUi()}
async function saveApprovalMode(){try{await api('/api/settings',{settings:{approval_mode:$('#approval-mode').value,approval_timeout_seconds:+$('#approval-timeout').value}});alert('接管设置已保存，后续及当前等待中的审批立即使用新设置。')}catch(e){alert(e.message)}await refresh()}
async function connectBridge(){try{const r=await api('/api/devices/flipper-zero/connect',{});alert(r.message);setTimeout(refresh,2500)}catch(e){alert(e.message)}}
function effectRow(state,e){return `<div class=effect data-state=${state}><b>${names[state]}</b><input class=color type=color value=${e.color}><div class=range><input class=brightness type=range min=0 max=100 value=${e.brightness} oninput="this.nextElementSibling.value=this.value+'%'"><output>${e.brightness}%</output></div><select class=mode>${Object.entries(modeNames).map(([v,n])=>`<option value=${v} ${v===e.mode?'selected':''}>${n}</option>`).join('')}</select><input class=duration type=number min=0 max=60 value=${e.duration} title="自动关闭秒数"><select class=sound>${Object.entries(soundNames).map(([v,n])=>`<option value=${v} ${v===e.sound?'selected':''}>${n}</option>`).join('')}</select></div>`}
async function loadEffects(){const d=await api('/api/effects');$('#effects').innerHTML=Object.entries(d.effects).map(([s,e])=>effectRow(s,e)).join('')}
async function saveEffects(){const effects={};document.querySelectorAll('.effect').forEach(r=>effects[r.dataset.state]={color:r.querySelector('.color').value,brightness:+r.querySelector('.brightness').value,mode:r.querySelector('.mode').value,duration:+r.querySelector('.duration').value,sound:r.querySelector('.sound').value});try{await api('/api/effects',{effects});alert('提醒设置已保存到电脑')}catch(e){alert(e.message)}}
function addEvent(e){const line=document.createElement('div');line.className='evt';line.innerHTML=`<span class=time>${e.time||''}</span> ${e.agent||'system'} · ${e.event||''} <b>${e.state||''}</b>`;$('#events').prepend(line)}
let refreshing=false;async function refresh(){if(refreshing)return;refreshing=true;try{const [s,a,d,u,c]=await Promise.all([api('/api/status'),api('/api/agents'),api('/api/devices'),api('/api/usb'),api('/api/settings')]);$('#service').textContent=`${s.platform} · v${s.version} · ${s.current_state}`;$('#approval-mode').value=c.settings.approval_mode;const dev=d.devices[0];$('#device').innerHTML=`<div class=row><div><b>${dev.name}</b><div class=sub>${dev.type.toUpperCase()} · ${dev.bridge}</div></div><div><span class="badge ${dev.connected?'on':''}">${dev.connected?'Bridge 在线':'Bridge 离线'}</span> ${dev.connected?'':`<button onclick=connectBridge()>连接蓝牙</button>`}</div></div>`;const usbText=u.busy?'USB 正在操作':!u.connected?'未检测到 USB 设备':u.error?'USB 已连接，查询失败':u.installed?(u.update_available?'已安装，可更新':'AI Pet 已安装'):'尚未安装 AI Pet';$('#usb').innerHTML=`<div class=row><div><b>USB / USB-C</b><div class=sub>${u.port||'连接 Flipper 后可检测和安装'}${u.error?' · '+u.error:''}</div></div><div><span class="badge ${u.connected&&!u.error?'on':''}">${usbText}</span> <button id=usb-install ${u.connected&&u.local_ready&&!u.busy?'':'disabled'} onclick=installUsb()>${u.installed?'更新':'安装'}</button> <button ${u.connected&&!u.busy?'':'disabled'} onclick=bindUsb()>绑定电脑</button></div></div>`;$('#states').innerHTML=dev.states.map(x=>`<button class=state data-s=${x} onclick="setState('${x}')">${names[x]}</button>`).join('');$('#agents').innerHTML=a.agents.map(x=>`<div class=row><div><b>${x.name}</b><div class=sub>${x.available?'已检测到客户端':'未检测到客户端'} · ${x.config}</div></div><div><span class="badge ${x.installed?'on':''}">${x.installed?'已接入':'未接入'}</span> <button ${x.available?'':'disabled'} onclick="installAgent('${x.id}')">${x.installed?'修复':'安装'}</button></div></div>`).join('');$('#platforms').innerHTML=s.platforms.map(x=>`<div class=platform><b>${x.name}</b><span class="badge ${x.current?'on':''}">${x.current?'当前系统':x.status}</span><div class=sub style="margin-top:8px">${x.service}<br>${x.package}</div></div>`).join('')}finally{refreshing=false}}
const es=new EventSource('/api/events');es.onmessage=e=>addEvent(JSON.parse(e.data));loadEffects();loadApprovalSettings();refresh();setInterval(refresh,5000);
</script></body></html>
